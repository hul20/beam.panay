[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iloilo3d"
version = "0.2.1"
description = "Geographically referenced Iloilo reconstruction pipeline for BeamNG.drive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "osmnx>=2.0,<3",
  "geopandas>=1.0,<2",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "pyogrio>=0.10,<1",
  "httpx>=0.28,<1",
  "defusedxml>=0.7.1,<1",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
iloilo3d = "iloilo3d.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: offline end-to-end tests", "live: opt-in external service checks"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

